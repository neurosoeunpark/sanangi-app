      {
        chapter: "5장 안전보건교육",
        statement: "안전교육의 3단계 순서는 '지식교육 ➔ 기능교육 ➔ 태도교육'이다.",
        answer: "O",
        desc: "1단계 지식전달, 2단계 실습을 통한 기능습득, 3단계 습관화를 위한 태도교육 순으로 진행됩니다."
      }
    ];

    // ----------------------------------------------------
    // [3] 포켓 요약노트 데이터베이스
    // ----------------------------------------------------
    const summaryNotes = [
      {
        title: "중대재해 기준 (산안법)",
        tags: ["중대재해", "사망자", "1명", "3개월", "10명"],
        body: "1. 사망자 1명 이상 발생<br>2. 3개월 이상 요양 부상자 동시 2명 이상<br>3. 부상자 또는 직업성 질병자 동시 10명 이상"
      },
      {
        title: "재해 구성 비율 공식",
        tags: ["하인리히", "버드", "1:29:300", "1:10:30:600"],
        body: "<b>하인리히 (1:29:300)</b>: 중상 1 : 경상 29 : 무상해사고 300<br><b>버드 (1:10:30:600)</b>: 중상 1 : 경상 10 : 무상해(물적) 30 : 아차사고 600"
      },
      {
        title: "안전모 구분 & 성능 기준",
        tags: ["안전모", "AB", "AE", "ABE", "4450N", "7000V"],
        body: "<b>AB</b>: 낙하·비래 + 추락 방지<br><b>AE</b>: 낙하·비래 + 머리 감전 방지<br><b>ABE</b>: 낙하·비래 + 추락 + 머리 감전(7000V 이하)<br>• 충격흡수성: 최고전달충격력 <b>4,450N 이하</b>"
      },
      {
        title: "방독마스크 정화통 측면 표시색",
        tags: ["정화통", "색상", "갈색", "회색", "노란색", "녹색"],
        body: "• <b>갈색</b>: 유기화합물용<br>• <b>회색</b>: 할로겐, 황화수소, 시안화수소용<br>• <b>노란색</b>: 아황산용<br>• <b>녹색</b>: 암모니아용"
      },
      {
        title: "안전보건표지 색채 기준",
        tags: ["표지", "빨간색", "노란색", "파란색", "녹색"],
        body: "• <b>빨간색(7.5R 4/14)</b>: 금지, 화학물질 경고<br>• <b>노란색(5Y 8.5/12)</b>: 경고(주의/기계방호물)<br>• <b>파란색(2.5PB 4/10)</b>: 지시(보호구 착용)<br>• <b>녹색(2.5G 4/10)</b>: 안내(비상구, 구호)"
      },
      {
        title: "인간 의식 수준 (Phase 레벨)",
        tags: ["의식", "Phase", "신뢰성", "적극활동"],
        body: "• <b>Phase 0</b>: 무의식/실신 (신뢰성 0)<br>• <b>Phase I</b>: 피로/의식둔화 (신뢰성 0.9 이하)<br>• <b>Phase II</b>: 휴식/이완 (신뢰성 0.99~0.99999)<br>• <b>Phase III</b>: 명료/적극활동 (신뢰성 <b>0.99999 이상</b>)<br>• <b>Phase IV</b>: 과긴장/패닉 (신뢰성 0.9 이하)"
      },
      {
        title: "생체리듬 (바이오리듬) 주기",
        tags: ["생체리듬", "바이오리듬", "23일", "28일", "33일"],
        body: "• <b>육체적 리듬 (P)</b>: 23일 주기 (청색 실선)<br>• <b>감성적 리듬 (S)</b>: 28일 주기 (적색 점선)<br>• <b>지성적 리듬 (I)</b>: 33일 주기 (녹색 일점쇄선)"
      },
      {
        title: "TWI 4대 교육과정",
        tags: ["TWI", "JIT", "JMT", "JRT", "JST"],
        body: "• <b>JIT</b>: 작업지도훈련 (Job Instruction)<br>• <b>JMT</b>: 작업방법훈련 (Job Method)<br>• <b>JRT</b>: 인간관계훈련 (Job Relation)<br>• <b>JST</b>: 작업안전훈련 (Job Safety)"
      }
    ];

    // ----------------------------------------------------
    // [4] 애플리케이션 상태 관리
    // ----------------------------------------------------
    let currentTab = "quiz";
    let currentCategory = "ALL";
    let quizIndex = 0;
    let answeredQuestions = {}; // { id: selectedIdx }
    let bookmarks = JSON.parse(localStorage.getItem("sanangi_bookmarks") || "[]");

    let oxIndex = 0;
    let oxStreak = 0;
    let oxAnswered = false;

    // ----------------------------------------------------
    // [5] 4지선다 퀴즈 기능
    // ----------------------------------------------------
    function getFilteredQuizList() {
      return quizData.filter(q => currentCategory === "ALL" || q.chapter === currentCategory);
    }

    function renderQuiz() {
      const list = getFilteredQuizList();
      const item = list[quizIndex];
      const explanationBox = document.getElementById("quiz-explanation-box");
      const bookmarkBtn = document.getElementById("quiz-bookmark-btn");

      if (!item) {
        document.getElementById("quiz-title").textContent = "선택한 과목에 등록된 문제가 없습니다.";
        document.getElementById("quiz-options").innerHTML = "";
        document.getElementById("quiz-progress").textContent = "0 / 0";
        document.getElementById("quiz-chapter").textContent = "없음";
        bookmarkBtn.textContent = "☆";
        explanationBox.classList.add("hidden");
        return;
      }

      document.getElementById("quiz-chapter").textContent = item.chapterName;
      document.getElementById("quiz-progress").textContent = `${quizIndex + 1} / ${list.length}`;
      document.getElementById("quiz-title").textContent = `Q. ${item.question}`;

      const isMarked = bookmarks.includes(item.id);
      bookmarkBtn.textContent = isMarked ? "★" : "☆";
      bookmarkBtn.className = isMarked 
        ? "text-xl leading-none text-yellow-500" 
        : "text-xl leading-none text-slate-300 dark:text-slate-600";

      const optContainer = document.getElementById("quiz-options");
      optContainer.innerHTML = "";
      const selected = answeredQuestions[item.id];

      item.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-3.5 rounded-2xl border text-xs sm:text-sm font-medium transition-all active:scale-[0.98]";
        
        if (selected !== undefined) {
          btn.disabled = true;
          if (idx === item.answer) {
            btn.className += " bg-emerald-50 dark:bg-emerald-950/40 border-emerald-500 text-emerald-700 dark:text-emerald-300 font-bold";
          } else if (idx === selected) {
            btn.className += " bg-rose-50 dark:bg-rose-950/40 border-rose-500 text-rose-700 dark:text-rose-300";
          } else {
            btn.className += " border-slate-200 dark:border-slate-700 text-slate-400 opacity-60";
          }
        } else {
          btn.className += " border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50";
          btn.onclick = () => selectQuizOption(idx);
        }

        btn.textContent = `${idx + 1}. ${opt}`;
        optContainer.appendChild(btn);
      });

      if (selected !== undefined) {
        explanationBox.classList.remove("hidden");
        const isCorrect = selected === item.answer;
        const statusEl = document.getElementById("quiz-result-status");
        statusEl.textContent = isCorrect ? "정답입니다! 🎉" : "오답입니다! (오답노트 자동 저장) 💡";
        statusEl.className = isCorrect ? "font-bold block mb-1 text-sm text-emerald-600" : "font-bold block mb-1 text-sm text-rose-600";
        document.getElementById("quiz-explanation-text").textContent = item.explanation;
      } else {
        explanationBox.classList.add("hidden");
      }
    }

    function selectQuizOption(idx) {
      const list = getFilteredQuizList();
      const item = list[quizIndex];
      answeredQuestions[item.id] = idx;

      // 오답이면 북마크에 자동 등록
      if (idx !== item.answer && !bookmarks.includes(item.id)) {
        bookmarks.push(item.id);
        saveBookmarks();
      }

      renderQuiz();
    }

    function toggleBookmark(id) {
      if (bookmarks.includes(id)) {
        bookmarks = bookmarks.filter(bId => bId !== id);
      } else {
        bookmarks.push(id);
      }
      saveBookmarks();
      renderQuiz();
      renderBookmarksList();
    }

    function saveBookmarks() {
      localStorage.setItem("sanangi_bookmarks", JSON.stringify(bookmarks));
      document.getElementById("bookmark-count").textContent = bookmarks.length;
    }

    // ----------------------------------------------------
    // [6] OX 스피드 모드 기능
    // ----------------------------------------------------
    function renderOX() {
      const item = oxData[oxIndex];
      oxAnswered = false;

      document.getElementById("ox-chapter").textContent = `[${item.chapter}] 지문`;
      document.getElementById("ox-statement").textContent = `"${item.statement}"`;
      document.getElementById("ox-streak-text").textContent = `연속 정답: ${oxStreak}회`;
      document.getElementById("ox-feedback-box").classList.add("hidden");
      document.getElementById("ox-buttons-box").classList.remove("hidden");
      document.getElementById("ox-next-box").classList.add("hidden");
    }

    function handleOXChoice(val) {
      if (oxAnswered) return;
      oxAnswered = true;

      const item = oxData[oxIndex];
      const isCorrect = val === item.answer;
      
      if (isCorrect) {
        oxStreak++;
      } else {
        oxStreak = 0;
      }

      const feedbackBox = document.getElementById("ox-feedback-box");
      const feedbackTitle = document.getElementById("ox-feedback-title");
      const feedbackDesc = document.getElementById("ox-feedback-desc");

      feedbackBox.classList.remove("hidden");
      feedbackTitle.textContent = isCorrect ? "정답입니다! 🎯" : `틀렸습니다! 정답은 [ ${item.answer} ] ❌`;
      feedbackTitle.className = isCorrect ? "font-bold block mb-1 text-sm text-emerald-600" : "font-bold block mb-1 text-sm text-rose-600";
      feedbackDesc.textContent = item.desc;

      document.getElementById("ox-buttons-box").classList.add("hidden");
      document.getElementById("ox-next-box").classList.remove("hidden");
      document.getElementById("ox-streak-text").textContent = `연속 정답: ${oxStreak}회`;
    }

    // ----------------------------------------------------
    // [7] 포켓 요약노트 기능
    // ----------------------------------------------------
    function renderSummaryCards(filter = "") {
      const container = document.getElementById("summary-cards-container");
      container.innerHTML = "";
      const query = filter.trim().toLowerCase();

      const filtered = summaryNotes.filter(n => {
        if (!query) return true;
        const textMatch = n.title.toLowerCase().includes(query) || n.body.toLowerCase().includes(query);
        const tagMatch = n.tags.some(t => t.toLowerCase().includes(query));
        return textMatch || tagMatch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="p-6 text-center text-xs text-slate-400">일치하는 요약 항목이 없습니다.</div>`;
        return;
      }

      filtered.forEach(note => {
        const card = document.createElement("div");
        card.className = "bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col gap-2";
        card.innerHTML = `
          <h4 class="text-xs font-black text-blue-600 dark:text-blue-400 tracking-wide">${note.title}</h4>
          <div class="text-xs text-slate-700 dark:text-slate-200 leading-relaxed">${note.body}</div>
        `;
        container.appendChild(card);
      });
    }

    // ----------------------------------------------------
    // [8] 오답노트 & 보관함 기능
    // ----------------------------------------------------
    function renderBookmarksList() {
      const container = document.getElementById("bookmarks-list");
      container.innerHTML = "";
      document.getElementById("bookmark-count").textContent = bookmarks.length;

      const markedQuestions = quizData.filter(q => bookmarks.includes(q.id));

      if (markedQuestions.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center text-slate-400 text-xs flex flex-col gap-2">
            <span>보관된 오답이나 북마크 문제가 없습니다.</span>
            <span>4지선다 모드에서 틀린 문제는 자동으로 이곳에 모입니다.</span>
          </div>
        `;
        return;
      }

      markedQuestions.forEach(q => {
        const card = document.createElement("div");
        card.className = "bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col gap-2 relative";
        card.innerHTML = `
          <div class="flex justify-between items-center text-xs">
            <span class="font-bold text-blue-600 dark:text-blue-400">${q.chapterName}</span>
            <button class="remove-btn text-rose-500 hover:text-rose-700 text-xs font-semibold">삭제</button>
          </div>
          <p class="text-xs font-bold leading-snug">Q. ${q.question}</p>
          <div class="text-xs text-slate-500 dark:text-slate-400 mt-1">
            <span class="font-bold text-emerald-600 dark:text-emerald-400">정답: ${q.answer + 1}번 (${q.options[q.answer]})</span>
            <p class="mt-1">${q.explanation}</p>
          </div>
        `;
        card.querySelector(".remove-btn").onclick = () => {
          toggleBookmark(q.id);
        };
        container.appendChild(card);
      });
    }

    // ----------------------------------------------------
    // [9] 이벤트 바인딩 및 초기화
    // ----------------------------------------------------
    // 탭 전환
    document.querySelectorAll(".nav-tab").forEach(tab => {
      tab.onclick = (e) => {
        const targetTab = e.currentTarget.dataset.tab;
        currentTab = targetTab;

        document.querySelectorAll(".nav-tab").forEach(b => {
          b.className = "nav-tab py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all text-center";
        });
        e.currentTarget.className = "nav-tab py-2 rounded-xl bg-blue-600 text-white shadow-sm transition-all text-center";

        document.querySelectorAll(".tab-content").forEach(sec => sec.classList.add("hidden"));
        document.getElementById(`section-${targetTab}`).classList.remove("hidden");

        if (targetTab === "bookmarks") renderBookmarksList();
        if (targetTab === "summary") renderSummaryCards();
      };
    });

    // 4지선다 카테고리 필터
    document.querySelectorAll(".cat-btn").forEach(btn => {
      btn.onclick = (e) => {
        document.querySelectorAll(".cat-btn").forEach(b => {
          b.className = "cat-btn px-3 py-1.5 rounded-full bg-slate-200 dark:bg-slate-800 whitespace-nowrap";
        });
        e.currentTarget.className = "cat-btn px-3 py-1.5 rounded-full bg-blue-600 text-white whitespace-nowrap";
        currentCategory = e.currentTarget.dataset.cat;
        quizIndex = 0;
        renderQuiz();
      };
    });

    // 4지선다 네비게이션
    document.getElementById("quiz-prev-btn").onclick = () => {
      const list = getFilteredQuizList();
      if (quizIndex > 0) {
        quizIndex--;
        renderQuiz();
      }
    };

    document.getElementById("quiz-next-btn").onclick = () => {
      const list = getFilteredQuizList();
      if (quizIndex < list.length - 1) {
        quizIndex++;
        renderQuiz();
      }
    };

    document.getElementById("quiz-random-btn").onclick = () => {
      const list = getFilteredQuizList();
      if (list.length > 1) {
        quizIndex = Math.floor(Math.random() * list.length);
        renderQuiz();
      }
    };

    document.getElementById("quiz-bookmark-btn").onclick = () => {
      const list = getFilteredQuizList();
      const item = list[quizIndex];
      if (item) toggleBookmark(item.id);
    };

    // OX 버튼 리스너
    document.querySelectorAll(".ox-choice-btn").forEach(btn => {
      btn.onclick = (e) => {
        handleOXChoice(e.currentTarget.dataset.val);
      };
    });

    document.getElementById("ox-next-btn").onclick = () => {
      oxIndex = (oxIndex + 1) % oxData.length;
      renderOX();
    };

    // 요약노트 검색 필터
    document.getElementById("summary-search").oninput = (e) => {
      renderSummaryCards(e.target.value);
    };

    // 오답노트 전체 비우기
    document.getElementById("clear-bookmarks-btn").onclick = () => {
      if (confirm("저장된 오답 및 북마크를 모두 삭제하시겠습니까?")) {
        bookmarks = [];
        saveBookmarks();
        renderBookmarksList();
        renderQuiz();
      }
    };

    // 다크모드 토글
    document.getElementById("dark-toggle").onclick = () => {
      document.documentElement.classList.toggle("dark");
    };

    // 앱 초기화 실행
    saveBookmarks();
    renderQuiz();
    renderOX();
    renderSummaryCards();
  </script>
</body>
</html>
